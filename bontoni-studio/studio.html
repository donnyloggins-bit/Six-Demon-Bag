<meta charset="utf-8">
<title>Bontoni Order Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Cinzel:wght@500&family=Cormorant+Garamond:ital,wght@1,500&family=Instrument+Sans:wght@400;500;600&family=Marcellus+SC&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Layout: workshop tool. Top bar with sections; each section is a working surface
   (library grid, or a three-pane editor: details | stage | zones & materials). */
:root{
  --bg:#F2F1EC; --panel:#FFFFFF; --sunk:#E9E8E2; --ink:#1B1C19; --muted:#6A6C65; --line:#D9D8D0;
  --accent:#1E5B3A; --accent-ink:#FFFFFF; --accent-soft:#DCEBE1; --brass:#9C6F24; --danger:#A52A21;
  --stage:#ECEBE6; --focus:#2F7D52;
  --f-ui:"Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  --f-sc:"Marcellus SC", "Copperplate", "Times New Roman", serif;
  --f-word:"Archivo Black", "Arial Black", Impact, sans-serif;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131512; --panel:#1C1E1B; --sunk:#252823; --ink:#ECEBE5; --muted:#9C9F96; --line:#343831;
  --accent:#62AE80; --accent-ink:#0D1A12; --accent-soft:#1F3428; --brass:#D2A65C; --danger:#F0877D;
  --stage:#2A2C28; --focus:#7CC79A; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#131512; --panel:#1C1E1B; --sunk:#252823; --ink:#ECEBE5; --muted:#9C9F96; --line:#343831;
  --accent:#62AE80; --accent-ink:#0D1A12; --accent-soft:#1F3428; --brass:#D2A65C; --danger:#F0877D;
  --stage:#2A2C28; --focus:#7CC79A; color-scheme:dark }
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-ui);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:20px;min-height:58px;flex-wrap:wrap;padding-block:6px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:6px}
.brand b{font-family:var(--f-sc);font-weight:400;font-size:20px;letter-spacing:.14em}
.brand span{color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
nav.tabs{display:flex;gap:2px;flex-wrap:wrap}
nav.tabs a{padding:8px 12px;border-radius:var(--r);text-decoration:none;color:var(--muted);font-weight:500}
nav.tabs a:hover{color:var(--ink);background:var(--sunk)}
nav.tabs a[aria-current="page"]{color:var(--ink);background:var(--sunk)}
.mode{margin-left:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.mode i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.mode.cloud i{background:var(--accent)}

main.wrap{padding-block:22px 60px}
.notice{background:var(--accent-soft);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;margin-bottom:16px;font-size:13px}
.notice.warn{background:var(--sunk)}

/* headings */
.head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.head h1{font-family:var(--f-sc);font-weight:400;font-size:28px;letter-spacing:.06em;margin:0;text-wrap:balance}
.head p{margin:2px 0 0;color:var(--muted);max-width:62ch}
.head .grow{flex:1;min-width:0}
.head .acts{display:flex;gap:8px;flex-wrap:wrap}

/* controls */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);padding:8px 13px;border-radius:var(--r);cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--danger)}
.btn.danger.armed{background:var(--danger);color:var(--panel);border-color:var(--danger)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{padding:5px 9px;font-size:12px}
label.f{display:grid;gap:4px;font-size:12px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.06em}
input[type=text],input[type=date],input[type=number],input[type=search],select,textarea{width:100%;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:7px 9px;font-size:14px;text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink)}
textarea{resize:vertical;min-height:64px}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.8}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;gap:7px;align-items:center;font-size:13px;cursor:pointer}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--panel);padding:6px 11px;cursor:pointer;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.muted{color:var(--muted)}
.small{font-size:12px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;background:var(--sunk);color:var(--muted)}
.chip.s-draft{background:var(--sunk)}
.chip.s-sent{background:#E7D9B8;color:#5B4210}
.chip.s-production{background:var(--accent-soft);color:var(--accent)}
.chip.s-delivered{background:var(--ink);color:var(--panel)}

/* library grids */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;text-align:left;padding:0}
.card:hover{border-color:var(--muted)}
.card .ph{aspect-ratio:4/3;background:var(--stage);display:grid;place-items:center;overflow:hidden;max-width:100%}
.card .ph img{width:100%;height:100%;object-fit:contain;filter:grayscale(1) contrast(1.05)}
.card .ph.sw img{object-fit:cover;filter:none}
.card .meta{padding:10px 12px;display:grid;gap:3px;min-width:0}
.card .meta b{font-weight:600;overflow-wrap:anywhere}
.card .meta span{color:var(--muted);font-size:12px}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:34px 20px;text-align:center;color:var(--muted);background:var(--panel)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.drop{border:1.5px dashed var(--line);border-radius:var(--r);padding:16px;background:var(--panel);display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop .grow{flex:1;min-width:200px}
.drop .opts{display:flex;gap:10px;flex-wrap:wrap}
.drop .opts label.f{min-width:150px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.filters .chipbtn{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:4px 11px;cursor:pointer;font-size:12px;font-weight:500}
.filters .chipbtn[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.progress{font-size:13px;color:var(--muted)}

/* orders list */
.olist{display:grid;gap:8px}
.orow{display:grid;grid-template-columns:auto 1fr auto auto;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}
.orow:hover{border-color:var(--muted)}
.orow .who{min-width:0;cursor:pointer}
.orow .who b{display:block;overflow-wrap:anywhere}
.orow .who span{color:var(--muted);font-size:12px}
.dots{display:flex;gap:3px}
.dots i{width:14px;height:14px;border-radius:50%;border:1px solid var(--line);display:inline-block;background-size:cover}
.date{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px}

/* editor layout */
.ed{display:grid;grid-template-columns:300px minmax(0,1fr) 320px;gap:16px;align-items:start}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:12px;min-width:0}
.pane h3{margin:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.pane hr{border:0;border-top:1px solid var(--line);margin:2px 0;width:100%}
.stagewrap{display:grid;gap:10px;min-width:0}
.stagebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stage{background:var(--stage);border:1px solid var(--line);border-radius:var(--r);position:relative;overflow:auto;max-height:72vh;touch-action:none}
.stage .inner{position:relative;margin:0 auto}
.stage canvas{display:block;position:absolute;inset:0;width:100%;height:100%}
.stage .tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--panel);font-size:12px;padding:3px 7px;border-radius:4px;white-space:nowrap;transform:translate(10px,10px)}
.stage .ph{padding:60px 20px;text-align:center;color:var(--muted)}
.sheetbox{background:var(--stage);border:1px solid var(--line);border-radius:var(--r);padding:10px;overflow:hidden}
.sheetbox canvas{width:100%;height:auto;display:block;box-shadow:0 1px 3px rgba(0,0,0,.18);background:#fff}
.zl{display:grid;gap:4px}
.zi{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;padding:6px 8px;border-radius:var(--r);border:1px solid transparent;cursor:pointer;background:none;text-align:left;width:100%}
.zi:hover{background:var(--sunk)}
.zi[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.zi .sw{width:22px;height:22px;border-radius:4px;border:1px solid var(--line);background-size:cover;background-position:center}
.zi b{font-weight:500;overflow-wrap:break-word;min-width:0}
.zi.oz{grid-template-columns:22px minmax(0,1fr) minmax(0,1.1fr)}
.zi span{font-size:12px;color:var(--muted);overflow-wrap:anywhere;text-align:right}
.zi input{padding:3px 6px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:8px;max-height:340px;overflow:auto;padding:2px}
.mt{border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:0;cursor:pointer;display:grid;text-align:center;overflow:hidden}
.mt:hover{border-color:var(--muted)}
.mt[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:1px}
.mt .sq{aspect-ratio:1;background-size:cover;background-position:center;max-width:100%}
.mt span{font-size:10px;line-height:1.2;padding:4px 3px;overflow-wrap:anywhere}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.slider{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.slider input{width:110px}
.presets{display:flex;flex-wrap:wrap;gap:4px}
.presets button{border:1px dashed var(--line);background:none;border-radius:99px;padding:2px 9px;font-size:12px;cursor:pointer;color:var(--muted)}
.presets button:hover{color:var(--ink);border-color:var(--muted)}
.refs{display:grid;gap:8px}
.ref{display:grid;grid-template-columns:52px 1fr auto;gap:8px;align-items:center}
.ref img{width:52px;height:52px;object-fit:cover;border-radius:4px;border:1px solid var(--line)}
.co{display:grid;grid-template-columns:1fr 110px auto;gap:6px}
.xr{display:grid;grid-template-columns:110px 1fr auto;gap:6px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:var(--r);z-index:50;max-width:min(560px,calc(100vw - 32px));font-size:13px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.toast.err{background:var(--danger)}
.modal{position:fixed;inset:0;background:rgba(10,12,10,.45);display:grid;place-items:center;z-index:40;padding:16px}
.modal .box{background:var(--panel);border-radius:10px;border:1px solid var(--line);width:min(560px,100%);max-height:90vh;overflow:auto;padding:18px;display:grid;gap:12px}
.modal h2{margin:0;font-family:var(--f-sc);font-weight:400;letter-spacing:.06em}
.texprev{height:120px;border-radius:var(--r);border:1px solid var(--line);background-repeat:repeat}
.kbd{font-family:ui-monospace,Menlo,monospace;font-size:11px;background:var(--sunk);padding:1px 5px;border-radius:3px}
.how{display:grid;gap:6px;font-size:13px;color:var(--muted)}
.how b{color:var(--ink);font-weight:600}

@media (max-width:1180px){.ed{grid-template-columns:280px minmax(0,1fr)}.ed > .pane.right{grid-column:1 / -1}}
@media (max-width:760px){.ed{grid-template-columns:1fr}.ed > .stagewrap{order:-1}.orow{grid-template-columns:auto 1fr;}.orow .date,.orow .dots{display:none}.grid2{grid-template-columns:1fr}.stage{max-height:60vh}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="top"><div class="wrap">
  <div class="brand"><b>BONTONI</b><span>Order studio</span></div>
  <nav class="tabs" id="tabs">
    <a href="#orders">Orders</a><a href="#styles">Styles</a><a href="#materials">Materials</a><a href="#settings">Settings</a>
  </nav>
  <div class="mode" id="mode"><i></i><span>Connecting…</span></div>
</div></header>
<main class="wrap" id="main"><div class="empty"><b>Opening the studio…</b>Loading your styles, materials and orders.</div></main>

<script>
"use strict";
/* ============================================================
   Utilities
   ============================================================ */
const $ = (s, r = document) => r.querySelector(s);
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  let val;
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'value') val = v;
    else if (k === 'checked' || k === 'disabled' || k === 'multiple' || k === 'selected') el[k] = !!v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  if (val !== undefined) el.value = val;
  return el;
}
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now()).replace(/-/g, '').slice(0, 20);
const clone = o => JSON.parse(JSON.stringify(o ?? null));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const titleCase = s => s.toLowerCase().replace(/\b([a-zà-ú])/g, m => m.toUpperCase());
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const todayISO = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
function hexToRgb(hex) { const m = /^#?([0-9a-f]{6})$/i.exec(hex || ''); if (!m) return [128, 128, 128]; const n = parseInt(m[1], 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
const rgbToHex = (r, g, b) => '#' + [r, g, b].map(v => Math.round(clamp(v, 0, 255)).toString(16).padStart(2, '0')).join('');
function mkCanvas(w, hgt) { const c = document.createElement('canvas'); c.width = w; c.height = hgt; return c; }
const ctx2d = c => c.getContext('2d', { willReadFrequently: true });
function toast(msg, err) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = h('div', { class: 'toast' + (err ? ' err' : ''), role: 'status' }, msg);
  document.body.append(t); setTimeout(() => t.remove(), err ? 6000 : 2800);
}
function confirmBtn(label, onConfirm, cls = 'btn danger') {
  const b = h('button', { class: cls, type: 'button' }, label);
  let armed = false, timer;
  b.addEventListener('click', () => {
    if (!armed) { armed = true; b.classList.add('armed'); b.textContent = 'Click again to ' + label.toLowerCase(); timer = setTimeout(() => { armed = false; b.classList.remove('armed'); b.textContent = label; }, 3500); return; }
    clearTimeout(timer); onConfirm();
  });
  return b;
}
function errMsg(e) { return (e && (e.message || e.code)) || String(e); }

/* ============================================================
   Storage: shared library (artifact db + assets) or this device (IndexedDB)
   ============================================================ */
const COLLS = ['styles', 'materials', 'orders', 'settings'];
const Store = {
  mode: 'local', db: null, assets: null, user: null, downloads: null,
  data: { styles: new Map(), materials: new Map(), orders: new Map(), settings: new Map() },
  loaded: false, canWrite: true, canUpload: true,
  listeners: new Set(),
  on(fn) { this.listeners.add(fn); return () => this.listeners.delete(fn); },
  emit(c) { for (const fn of [...this.listeners]) { try { fn(c); } catch (e) { console.error(e); } } },
};
const writeChains = new Map();

const IDB = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('bontoni-order-studio', 1);
      r.onupgradeneeded = () => { r.result.createObjectStore('docs'); r.result.createObjectStore('blobs'); };
      r.onsuccess = () => { this.db = r.result; res(r.result); };
      r.onerror = () => rej(r.error);
    });
  },
  run(store, mode, fn) {
    return new Promise((res, rej) => {
      const t = this.db.transaction(store, mode); const req = fn(t.objectStore(store));
      t.oncomplete = () => res(req && req.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  },
};

async function initCloud() {
  let tries = 0;
  while (!(window.claude && typeof window.claude.use === 'function') && tries < 15) { await new Promise(r => setTimeout(r, 100)); tries++; }
  if (!(window.claude && typeof window.claude.use === 'function')) return false;
  const db = await window.claude.use('db');
  if (!db) return false;
  Store.db = db; Store.mode = 'cloud';
  const [assets, user, downloads] = await Promise.all([
    window.claude.use('assets').catch(() => null), window.claude.use('user').catch(() => null), window.claude.use('downloads').catch(() => null)]);
  Store.assets = assets; Store.user = user; Store.downloads = downloads;
  Store.canUpload = !!assets;
  try { const w = user && user.can ? await user.can('data.write') : null; Store.canWrite = w !== false; } catch { Store.canWrite = true; }
  let pending = new Set(COLLS);
  const slow = setTimeout(() => { if (pending.size) setMode('The shared library is slow to answer. What you see may be out of date.'); }, 10000);
  for (const c of COLLS) {
    db.collection(c).onSnapshot(snap => {
      const m = new Map(); snap.docs.forEach(d => m.set(d.id, Object.assign({}, d.data(), { id: d.id })));
      Store.data[c] = m;
      if (!snap.metadata.fromCache && pending.delete(c) && !pending.size) { clearTimeout(slow); setMode(); }
      Store.emit(c);
    }, err => { console.warn(c, err); toast('Lost the connection to the shared ' + c + ' list (' + err.code + '). Reload the page to reconnect.', true); });
  }
  return true;
}
async function initLocal() {
  Store.mode = 'local';
  try {
    await IDB.open();
    const [keys, vals] = await Promise.all([IDB.run('docs', 'readonly', s => s.getAllKeys()), IDB.run('docs', 'readonly', s => s.getAll())]);
    keys.forEach((k, i) => { const [c, id] = String(k).split('/'); if (Store.data[c]) Store.data[c].set(id, Object.assign({}, vals[i], { id })); });
  } catch (e) { console.warn('IndexedDB unavailable', e); IDB.db = null; }
  COLLS.forEach(c => Store.emit(c));
}
function put(coll, id, body) {
  const doc = clone(body); delete doc.id; doc.updatedAt = Date.now();
  Store.data[coll].set(id, Object.assign({}, doc, { id }));
  Store.emit(coll);
  const key = coll + '/' + id;
  const prev = writeChains.get(key) || Promise.resolve();
  const next = prev.then(async () => {
    if (Store.mode === 'cloud') {
      try { await Store.db.collection(coll).doc(id).set(doc); }
      catch (e) {
        if (e && e.code === 'unavailable') { await new Promise(r => setTimeout(r, 600 + Math.random() * 600)); await Store.db.collection(coll).doc(id).set(doc); }
        else throw e;
      }
    } else if (IDB.db) await IDB.run('docs', 'readwrite', s => s.put(doc, key));
  }).catch(e => {
    if (e && e.code === 'invalid_argument') { Store.canWrite = false; toast('You can view this library but not change it. Ask the owner for Contributor or Editor access.', true); }
    else if (e && e.code === 'quota_exceeded') toast('The shared library is full. Delete old orders to make room.', true);
    else toast('Could not save: ' + errMsg(e), true);
  });
  writeChains.set(key, next);
  return next;
}
function del(coll, id) {

const SHEET_W = 2000, SHEET_H = 1250;
const SF = { sc: '"Marcellus SC", "Copperplate", serif', word: '"Archivo Black", "Arial Black", sans-serif', maker: '"Cinzel", "Trajan Pro", serif', };
let fontsReady = null;
function loadFonts() {
  if (!fontsReady) fontsReady = Promise.all(['30px "Marcellus SC"', '30px "Archivo Black"', '500 30px "Cinzel"', 'italic 500 30px "Cormorant Garamond"'].map(f => document.fonts.load(f).catch(() => { }))).then(() => { });

}
function spaced(x, text, px, py, sp, align = 'left') {

async function drawSheet(o) {
  await loadFonts();
  const W = SHEET_W, H = SHEET_H, M = 70;
  const c = mkCanvas(W, H); const x = c.getContext('2d');

  const s = settings(); const style = Store.data.styles.get(o.styleId); const auto = autoTexts(o, style);

  const up = v => String(v || '').toUpperCase();
  const date = o.date ? new Date(o.date + 'T12:00:00Z').toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric', timeZone: 'UTC' }).toUpperCase() : '';

  // header (left)
  x.fillStyle = INK; x.font = `92px ${SF.word}`; const nameW = spaced(x, up(s.storeName), M - 4, 128, 1);
  x.font = `30px ${SF.sc}`; spaced(x, up(s.storeCity), M + 4, 168, 2);
  x.font = `30px ${SF.sc}`; spaced(x, date, M + nameW + 70, 108, 3);
  // maker (right)
  const RX = 1020, RW = W - M - RX;
  x.font = `500 42px ${SF.maker}`; spaced(x, up(s.makerName), W - M, 92, 9, 'right');
  x.font = `italic 500 30px "Cormorant Garamond", Georgia, serif`; x.textAlign = 'right'; x.fillText(s.makerTag || '', W - M - 30, 128); x.textAlign = 'left';

  // table
  const rows = [['CLIENT', o.client], ['MODEL', o.modelText || auto.model], ['LAST', o.last || auto.last], ['SIZE', o.size], ['CONSTRUCTION', o.construction || auto.construction], ['COLOR', o.colorText || auto.color], ['MATERIAL', o.materialText || auto.material], ['SOLE', o.soleText || auto.sole], ['FIRST COST', o.firstCost]];
  for (const r of o.extraRows || []) if (r.label || r.value) rows.push([up(r.label), r.value]);

  else if (sole) { x.fillStyle = sole.color; x.fillRect(soleBox.x + 20, soleBox.y + soleBox.h * 0.2, soleBox.w - 40, soleBox.h * 0.6); }
  else placeholder(soleBox.x, soleBox.y, soleBox.w, soleBox.h, 'NO SOLE SWATCH');
  x.fillStyle = INK; x.font = `30px ${SF.sc}`;
  spaced(x, 'TOP VIEW', topBox.x + topBox.w / 2, boxTop + bh + 38, 3, 'center');
  spaced(x, 'SOLE', soleBox.x + soleBox.w / 2, boxTop + bh + 38, 3, 'center');

  const anchor = z => {

  for (const [mid, zs] of byMat) tiles.push({ mat: Store.data.materials.get(mid), zones: zs });
  for (const r of o.refs || []) tiles.push({ ref: r });
  const coTop = sideBox.y + sideBox.h + 78;
  const tilesTop = coTop + Math.max(0, callouts.length - 1) * 34 + (callouts.length ? 26 : 0);
  if (tiles.length) {
    const gap = 26, n = tiles.length; const capSpace = 64;
    const size = Math.min(250, (RW - gap * (n - 1)) / n, H - 40 - capSpace - tilesTop);
    const rowW = n * size + (n - 1) * gap; let tx = RX + (RW - rowW) / 2;
    for (const t of tiles) {
      if (t.mat) {
        if (t.mat.imageId) { try { coverDraw(x, await loadImg(t.mat.imageId), tx, tilesTop, size, size); } catch { x.fillStyle = t.mat.color; x.fillRect(tx, tilesTop, size, size); } }
        else { x.fillStyle = t.mat.color; x.fillRect(tx, tilesTop, size, size); }
        x.strokeStyle = '#D0D0CC'; x.lineWidth = 1; x.strokeRect(tx + .5, tilesTop + .5, size - 1, size - 1);
        x.fillStyle = INK; x.font = `${size < 170 ? 16 : 19}px ${SF.sc}`;
        const lines = wrapText(x, up(matName(t.mat)), size + gap - 6).slice(0, 2);
        lines.forEach((ln, k) => spaced(x, ln, tx + size / 2, tilesTop + size + 28 + k * 22, 1, 'center'));
        if (o.leaders !== false) {
          x.strokeStyle = '#1A1A1A'; x.lineWidth = 2;
          for (const z of t.zones) { const a = anchor(z.id); if (!a) continue; x.beginPath(); x.moveTo(tx + size / 2, tilesTop - 4); x.lineTo(a[0], a[1]); x.stroke(); x.fillStyle = '#1A1A1A'; x.beginPath(); x.arc(a[0], a[1], 4, 0, 7); x.fill(); }
        }
      } else {
        try { coverDraw(x, await loadImg(t.ref.imageId), tx, tilesTop, size, size); } catch { placeholder(tx, tilesTop, size, size, 'PHOTO'); }
        x.fillStyle = INK; x.font = `${size < 170 ? 16 : 19}px ${SF.sc}`;
        wrapText(x, up(t.ref.caption), size + gap - 6).slice(0, 2).forEach((ln, k) => spaced(x, ln, tx + size / 2, tilesTop + size + 28 + k * 22, 1, 'center'));
      }
      tx += size + gap;
    }
  }
  // red callouts
  x.font = `24px ${SF.sc}`;
  callouts.forEach((cq, i) => {
    const ty = coTop + i * 34; x.fillStyle = RED; const w = spaced(x, up(cq.text), RX, ty, 2);
    const a = cq.zoneId ? anchor(cq.zoneId) : null;
    if (a) { x.strokeStyle = RED; x.lineWidth = 2.5; x.beginPath(); x.moveTo(RX + w + 10, ty - 8); x.lineTo(a[0], a[1]); x.stroke(); x.fillStyle = RED; x.beginPath(); x.arc(a[0], a[1], 4.5, 0, 7); x.fill(); }
  });
  return c;
}

async function exportPdf(ids, live) {
  if (!ids.length) return;
  if (!window.jspdf) return toast('The PDF tool did not load. Check your connection and reload.', true);
  toast(ids.length > 1 ? `Building ${ids.length} sheets…` : 'Building the PDF…');
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ orientation: 'landscape', unit: 'pt', format: [1000, 625] });
  let first = true;
  const orders = ids.map(i => (live && live.id === i) ? live : Store.data.orders.get(i)).filter(Boolean)
    .sort((a, b) => (a.date || '').localeCompare(b.date || '') || (a.client || '').localeCompare(b.client || ''));
  for (const o of orders) {
    const c = await drawSheet(o);
    if (!first) pdf.addPage([1000, 625], 'landscape'); first = false;
    pdf.addImage(c.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, 1000, 625);
  }
  const name = orders.length === 1 ? [(orders[0].client || 'client'), styleLabel(orders[0]) || 'order', orders[0].date].join('_').replace(/\s+/g, '-').replace(/[^\w\-]+/g, '') : 'bontoni-orders-' + todayISO();
  saveFile(name + '.pdf', pdf.output('blob'));
}
